<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dodge & shoot</title>
</head>
<style>
    *{
        margin:0 ;
        padding:0 ;
        box-sizing: border-box;
    }
    body{
        background-color:#090a0f ;
        color:#fff ;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif ;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height:100vh ;
    }
    #ui {
        position: absolute;
        top:20px ;
        display: flex;
        gap:30px ;
        font-size:1.2rem ;
        letter-spacing: 1px;
        text-shadow:0 0 10px #00f3ff ;
        pointer-events: none;

    }
    canvas {
        border:2px solid #00f3ff ;
        box-shadow:0 0 25px rgba(0, 243,255,0.3) ;
        background: radial-gradient(circle at center,#121629 0%, #090a0f 100%);
        cursor: crosshair; 
    }
    #gameOver{
        position: absolute;
        display: flex;
        flex-direction: column;
        align-items: center;
        background: rgba(9,10,15,0.85);
        padding:30px 50px ;
        border:2px solid #ff0055 ;
        box-shadow: 0 0 30px rgba(255,0,85,0.5);
        text-align: center;

    }
    button{
        margin-top:20px ;
        padding:10px 25px ;
        font-size:1rem ;
        background:#00f3ff ;
        color:#090a0f ;
        border: none;
        border-radius:5px ;
        cursor:pointer ;
        font-weight:bold ;
        box-shadow:0 0 15px #00f3ff ;
        transition:0.2s ;
    }
    .heightScore{
        text-align: center;
        
    }
    button:hover{
        background:#fff ;
        transform: scale(1.05);
    }
</style>
<body>
    <div id="ui">
        <div>points: <span id="score">0</span></div>
        <div>control:move the mouse and click to shoot</div>
    </div>
    <canvas id="gameCanvas" width="800" height="550"></canvas>
    <div id="gameOver">
        <h2 style="color: #ff0055;font-size:2rem;text-shadow:0 0 10px #ff0055;">game Over</h2>
        <p style="margin-top:10px ;font-size: 1.2rem; ">your points:<spane id="finalScore">0</spane></p>
        <button onclick="resetGame()">try game</button> 
    </div>
    <div class="height score">
        <p id="margin-top:10px,font-size:1.2rem">height score:1000</p>
    </div>
</body>
<script>
    const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const gameOverEl = document.getElementById('gameOver');
        const finalScoreEl = document.getElementById('finalScore');

        let score = 0;
        let isGameOver = false;
        let animationId;

        // اللاعب
        const player = {
            x: canvas.width / 2,
            y: canvas.height - 50,
            radius: 15,
            color: '#00f3ff'
        };

        let bullets = [];
        let enemies = [];
        let particles = [];

        // تحريك اللاعب بالماوس
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left;
        });

        // إطلاق النار عند الضغط
        canvas.addEventListener('mousedown', () => {
            if (isGameOver) return;
            bullets.push({
                x: player.x,
                y: player.y - player.radius,
                radius: 4,
                speed: 8,
                color: '#fff'
            });
        });

        // توليد الأعداء (الضغوطات!)
        function spawnEnemy() {
            if (isGameOver) return;
            const size = Math.random() * 20 + 15;
            enemies.push({
                x: Math.random() * (canvas.width - size * 2) + size,
                y: -size,
                size: size,
                speed: Math.random() * 2.5 + 1.5 + (score * 0.01),
                color: '#ff0055'
            });
            setTimeout(spawnEnemy, Math.max(300, 1000 - score * 5));
        }

        // تأثير الانفجار (Particles)
        function createExplosion(x, y, color) {
            for (let i = 0; i < 15; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 8,
                    vy: (Math.random() - 0.5) * 8,
                    alpha: 1,
                    color: color
                });
            }
        }

        function update() {
            if (isGameOver) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم اللاعب
            ctx.beginPath();
            ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 15;
            ctx.shadowColor = player.color;
            ctx.fill();
            ctx.closePath();

            // تحديث ورسم الطلقات
            bullets.forEach((b, index) => {
                b.y -= b.speed;
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                ctx.fillStyle = b.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f3ff';
                ctx.fill();
                ctx.closePath();

                if (b.y < 0) bullets.splice(index, 1);
            });

            // تحديث ورسم الأعداء
            enemies.forEach((enemy, eIndex) => {
                enemy.y += enemy.speed;

                ctx.fillStyle = enemy.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = enemy.color;
                ctx.fillRect(enemy.x - enemy.size/2, enemy.y - enemy.size/2, enemy.size, enemy.size);

                // تصادم العدو مع اللاعب
                const distPlayer = Math.hypot(player.x - enemy.x, player.y - enemy.y);
                if (distPlayer - enemy.size/2 - player.radius < 1) {
                    endGame();
                }

                // تصادم الطلقات مع العدو
                bullets.forEach((bullet, bIndex) => {
                    const distBullet = Math.hypot(bullet.x - enemy.x, bullet.y - enemy.y);
                    if (distBullet - enemy.size/2 - bullet.radius < 1) {
                        createExplosion(enemy.x, enemy.y, enemy.color);
                        enemies.splice(eIndex, 1);
                        bullets.splice(bIndex, 1);
                        score += 10;
                        scoreEl.innerText = score;
                    }
                });

                if (enemy.y > canvas.height + enemy.size) {
                    enemies.splice(eIndex, 1);
                }
            });

            // تحديث ورسم الشظايا
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.03;

                ctx.save();
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x, p.y, 4, 4);
                ctx.restore();

                if (p.alpha <= 0) particles.splice(index, 1);
            });

            animationId = requestAnimationFrame(update);
        }

        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationId);
            finalScoreEl.innerText = score;
            gameOverEl.style.display = 'flex';
        }

        function resetGame() {
            score = 0;
            scoreEl.innerText = score;
            bullets = [];
            enemies = [];
            particles = [];
            isGameOver = false;
            gameOverEl.style.display = 'none';
            update();
            spawnEnemy();
        }

        // بدء اللعبة
        update();
        spawnEnemy();

</script>
</html>
